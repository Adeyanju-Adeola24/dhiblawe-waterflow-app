services:
  - type: web
    name: dhiblawe-waterflow-api
    runtime: node
    region: oregon
    plan: free
    rootDirectory: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dhiblawe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: dhiblawe-db
    region: oregon
